<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — KHARAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
    .grid-bg {
      background-image: linear-gradient(rgba(245,158,11,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(245,158,11,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .input-field {
      background: #1e293b; border: 1px solid #334155; color: #f1f5f9;
      border-radius: 2px; padding: 0.65rem 1rem; width: 100%;
      font-size: 0.875rem; transition: border-color 0.2s; outline: none;
    }
    .input-field:focus { border-color: #f59e0b; }
    .input-field::placeholder { color: #64748b; }
    .pw-strength-bar { height: 3px; border-radius: 2px; transition: width 0.3s, background 0.3s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
    .shake { animation: shake 0.3s ease; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center grid-bg">

  <div class="w-full max-w-md px-4 py-12">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2 text-amber-400 font-bold text-2xl tracking-wider">
        <i data-lucide="settings" class="w-7 h-7"></i>
        <span>KHARAT</span>
      </a>
      <p class="text-slate-500 text-sm mt-2 font-medium">Precision Engineering Workshop</p>
    </div>

    <!-- Card -->
    <div class="bg-slate-800 border border-slate-700 rounded-sm p-8">
      <div class="mb-6">
        <h1 class="text-xl font-bold text-slate-100">Create your account</h1>
        <p class="text-slate-500 text-sm mt-1">Join KHARAT and start shopping.</p>
      </div>

      <!-- Error banner -->
      <div id="error-banner" class="hidden mb-4 flex items-start gap-3 bg-red-500/10 border border-red-500/30 text-red-400 text-sm px-4 py-3 rounded-sm">
        <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
        <span id="error-text"></span>
      </div>

      <form id="signup-form" novalidate>
        <!-- Full Name -->
        <div class="mb-4">
          <label class="block text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1.5" for="full_name">Full Name</label>
          <input id="full_name" type="text" name="full_name" autocomplete="name" placeholder="Ahmed Khan" class="input-field" required />
          <div id="name-error" class="text-red-400 text-xs mt-1 hidden"></div>
        </div>

        <!-- Email -->
        <div class="mb-4">
          <label class="block text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1.5" for="email">Email</label>
          <input id="email" type="email" name="email" autocomplete="email" placeholder="you@example.com" class="input-field" required />
          <div id="email-error" class="text-red-400 text-xs mt-1 hidden"></div>
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label class="block text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1.5" for="password">Password</label>
          <div class="relative">
            <input id="password" type="password" name="password" autocomplete="new-password" placeholder="Min. 6 characters" class="input-field pr-10" required />
            <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-amber-400 transition-colors">
              <i data-lucide="eye" class="w-4 h-4" id="pw-eye-icon"></i>
            </button>
          </div>
          <!-- Password strength -->
          <div class="mt-2 flex gap-1">
            <div class="flex-1 h-1 bg-slate-700 rounded-sm overflow-hidden">
              <div id="strength-bar-1" class="pw-strength-bar w-0 bg-red-400"></div>
            </div>
            <div class="flex-1 h-1 bg-slate-700 rounded-sm overflow-hidden">
              <div id="strength-bar-2" class="pw-strength-bar w-0 bg-yellow-400"></div>
            </div>
            <div class="flex-1 h-1 bg-slate-700 rounded-sm overflow-hidden">
              <div id="strength-bar-3" class="pw-strength-bar w-0 bg-green-400"></div>
            </div>
          </div>
          <div id="strength-label" class="text-xs mt-1 text-slate-600"></div>
          <div id="password-error" class="text-red-400 text-xs mt-1 hidden"></div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-6">
          <label class="block text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1.5" for="confirm_password">Confirm Password</label>
          <div class="relative">
            <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" placeholder="Repeat password" class="input-field pr-10" required />
            <button type="button" id="toggle-cpw" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-amber-400 transition-colors">
              <i data-lucide="eye" class="w-4 h-4" id="cpw-eye-icon"></i>
            </button>
          </div>
          <div id="confirm-error" class="text-red-400 text-xs mt-1 hidden"></div>
        </div>

        <!-- Submit -->
        <button type="submit" id="submit-btn"
          class="w-full flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3 rounded-sm transition-colors text-sm">
          <span id="btn-text">Create Account</span>
          <i data-lucide="user-plus" class="w-4 h-4" id="btn-icon"></i>
          <svg id="btn-spinner" class="hidden animate-spin w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-slate-500">
        Already have an account?
        <a href="login.html" class="text-amber-400 hover:text-amber-300 font-semibold ml-1 transition-colors">Sign in</a>
      </div>
    </div>

    <div class="text-center mt-6">
      <a href="index.html" class="inline-flex items-center gap-1 text-slate-500 hover:text-amber-400 text-sm transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to store
      </a>
    </div>
  </div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="js/utils.js"></script>
<script>
  if (getToken()) window.location.href = "index.html";

  lucide.createIcons();

  // Toggle password visibility
  function makeToggle(btnId, inputId, iconId) {
    var vis = false;
    document.getElementById(btnId).addEventListener("click", function() {
      vis = !vis;
      document.getElementById(inputId).type = vis ? "text" : "password";
      document.getElementById(iconId).setAttribute("data-lucide", vis ? "eye-off" : "eye");
      lucide.createIcons({ nodes: [document.getElementById(iconId).parentElement] });
    });
  }
  makeToggle("toggle-pw", "password", "pw-eye-icon");
  makeToggle("toggle-cpw", "confirm_password", "cpw-eye-icon");

  // Password strength
  document.getElementById("password").addEventListener("input", function() {
    var val = this.value;
    var score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;

    var labels = ["", "Weak", "Fair", "Strong"];
    var colors = ["", "bg-red-400", "bg-yellow-400", "bg-green-400"];
    document.getElementById("strength-label").textContent = val.length > 0 ? labels[score] : "";
    document.getElementById("strength-label").className = "text-xs mt-1 " + (score === 1 ? "text-red-400" : score === 2 ? "text-yellow-400" : score === 3 ? "text-green-400" : "text-slate-600");

    for (var i = 1; i <= 3; i++) {
      var bar = document.getElementById("strength-bar-" + i);
      bar.className = "pw-strength-bar " + (i <= score ? colors[i] : "bg-transparent");
      bar.style.width = i <= score ? "100%" : "0%";
    }
  });

  // Form submit
  document.getElementById("signup-form").addEventListener("submit", function(e) {
    e.preventDefault();
    var full_name = document.getElementById("full_name").value.trim();
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;
    var confirm = document.getElementById("confirm_password").value;

    // Reset errors
    ["name-error","email-error","password-error","confirm-error"].forEach(function(id){
      document.getElementById(id).classList.add("hidden");
    });
    document.getElementById("error-banner").classList.add("hidden");

    var valid = true;
    if (!full_name || full_name.length < 2) {
      document.getElementById("name-error").textContent = "Enter your full name (at least 2 characters)";
      document.getElementById("name-error").classList.remove("hidden");
      valid = false;
    }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById("email-error").textContent = "Enter a valid email address";
      document.getElementById("email-error").classList.remove("hidden");
      valid = false;
    }
    if (!password || password.length < 6) {
      document.getElementById("password-error").textContent = "Password must be at least 6 characters";
      document.getElementById("password-error").classList.remove("hidden");
      valid = false;
    }
    if (password !== confirm) {
      document.getElementById("confirm-error").textContent = "Passwords do not match";
      document.getElementById("confirm-error").classList.remove("hidden");
      valid = false;
    }

    if (!valid) {
      document.getElementById("signup-form").classList.add("shake");
      setTimeout(function(){ document.getElementById("signup-form").classList.remove("shake"); }, 400);
      return;
    }

    // Loading
    document.getElementById("submit-btn").disabled = true;
    document.getElementById("btn-text").textContent = "Creating account…";
    document.getElementById("btn-icon").classList.add("hidden");
    document.getElementById("btn-spinner").classList.remove("hidden");

    fetch(API_BASE + "/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ full_name: full_name, email: email, password: password })
    })
    .then(function(r) {
      return r.json().then(function(data) { return { ok: r.ok, data: data }; });
    })
    .then(function(result) {
      if (!result.ok) {
        throw new Error(result.data.detail || result.data.message || "Registration failed");
      }
      // Auto-login
      return fetch(API_BASE + "/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password })
      });
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var token = data.access_token || data.token;
      var user = data.user || { email: email, full_name: full_name };
      if (token) {
        setAuth(token, user);
        showToast("Account created! Welcome to KHARAT.", "success");
        setTimeout(function() { window.location.href = "index.html"; }, 900);
      } else {
        // Registration succeeded but auto-login failed — go to login
        showToast("Account created! Please sign in.", "success");
        setTimeout(function() { window.location.href = "login.html"; }, 1200);
      }
    })
    .catch(function(err) {
      document.getElementById("error-text").textContent = err.message || "Registration failed. Please try again.";
      document.getElementById("error-banner").classList.remove("hidden");
      document.getElementById("submit-btn").disabled = false;
      document.getElementById("btn-text").textContent = "Create Account";
      document.getElementById("btn-icon").classList.remove("hidden");
      document.getElementById("btn-spinner").classList.add("hidden");
      lucide.createIcons();
    });
  });
</script>
</body>
</html>
