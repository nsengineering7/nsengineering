<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Detail — KHARAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
    .skeleton { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius:2px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .nav-link::after { content:''; position:absolute; bottom:-2px; left:0; width:0; height:2px; background:#f59e0b; transition:width 0.2s; }
    .nav-link:hover::after { width:100%; }
    ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:#0f172a; } ::-webkit-scrollbar-thumb { background:#334155; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

<!-- NAVBAR -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-700/60">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <a href="index.html" class="flex items-center gap-2 text-amber-400 font-bold text-xl tracking-wider">
        <i data-lucide="settings" class="w-6 h-6"></i>
        <span>KHARAT</span>
      </a>
      <div class="hidden md:flex items-center gap-8">
        <a href="index.html" class="nav-link relative text-slate-300 hover:text-amber-400 text-sm font-medium transition-colors">Home</a>
        <a href="index.html#products" class="nav-link relative text-slate-300 hover:text-amber-400 text-sm font-medium transition-colors">Products</a>
        <a href="index.html#about" class="nav-link relative text-slate-300 hover:text-amber-400 text-sm font-medium transition-colors">About</a>
      </div>
      <div class="flex items-center gap-3">
        <a href="cart.html" class="relative p-2 text-slate-300 hover:text-amber-400 transition-colors">
          <i data-lucide="shopping-cart" class="w-5 h-5"></i>
          <span class="cart-badge absolute -top-0.5 -right-0.5 bg-amber-500 text-slate-900 text-xs font-bold rounded-full w-4 h-4 items-center justify-center hidden"></span>
        </a>
        <div id="nav-guest" class="hidden items-center gap-2">
          <a href="login.html" class="text-sm text-slate-300 hover:text-amber-400 transition-colors px-3 py-1.5 font-medium">Login</a>
          <a href="signup.html" class="text-sm bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold px-3 py-1.5 rounded-sm transition-colors">Sign Up</a>
        </div>
        <div id="nav-user" class="hidden items-center gap-3 relative">
          <div class="relative group">
            <button class="flex items-center gap-2 text-sm text-slate-300 hover:text-amber-400 transition-colors font-medium">
              <i data-lucide="user-circle" class="w-5 h-5"></i>
              <span id="nav-username"></span>
              <i data-lucide="chevron-down" class="w-3 h-3"></i>
            </button>
            <div class="absolute right-0 top-full mt-2 w-44 bg-slate-800 border border-slate-700 shadow-xl rounded-sm hidden group-hover:block">
              <a href="orders.html" class="flex items-center gap-2 px-4 py-2.5 text-sm text-slate-300 hover:text-amber-400 hover:bg-slate-700 transition-colors"><i data-lucide="package" class="w-4 h-4"></i> My Orders</a>
              <a id="nav-admin" href="admin.html" class="hidden flex items-center gap-2 px-4 py-2.5 text-sm text-slate-300 hover:text-amber-400 hover:bg-slate-700 transition-colors"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Admin</a>
              <hr class="border-slate-700 my-1" />
              <button id="logout-btn" class="w-full flex items-center gap-2 px-4 py-2.5 text-sm text-red-400 hover:bg-slate-700 transition-colors"><i data-lucide="log-out" class="w-4 h-4"></i> Logout</button>
            </div>
          </div>
        </div>
        <button id="hamburger-btn" class="md:hidden p-2 text-slate-300 hover:text-amber-400">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
    <div id="mobile-menu" class="hidden md:hidden border-t border-slate-700/60 py-3 space-y-1">
      <a href="index.html" class="block px-3 py-2 text-slate-300 hover:text-amber-400 text-sm">Home</a>
      <a href="index.html#products" class="block px-3 py-2 text-slate-300 hover:text-amber-400 text-sm">Products</a>
      <a href="cart.html" class="block px-3 py-2 text-slate-300 hover:text-amber-400 text-sm">Cart</a>
    </div>
  </div>
</nav>

<!-- MAIN CONTENT -->
<main class="pt-24 pb-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

  <!-- Breadcrumb -->
  <nav class="flex items-center gap-2 text-sm text-slate-500 mb-8">
    <a href="index.html" class="hover:text-amber-400 transition-colors">Home</a>
    <i data-lucide="chevron-right" class="w-3 h-3"></i>
    <a href="index.html#products" class="hover:text-amber-400 transition-colors">Products</a>
    <i data-lucide="chevron-right" class="w-3 h-3"></i>
    <span id="breadcrumb-name" class="text-slate-300">Loading…</span>
  </nav>

  <!-- Product Detail -->
  <div id="product-skeleton" class="grid lg:grid-cols-2 gap-12 mb-20">
    <div class="skeleton h-96"></div>
    <div class="space-y-4">
      <div class="skeleton h-6 w-24"></div>
      <div class="skeleton h-10 w-3/4"></div>
      <div class="skeleton h-8 w-32"></div>
      <div class="skeleton h-24 w-full"></div>
      <div class="skeleton h-12 w-full"></div>
    </div>
  </div>

  <div id="product-detail" class="hidden grid lg:grid-cols-2 gap-12 mb-20">
    <!-- Image -->
    <div class="rounded-sm overflow-hidden bg-slate-800 border border-slate-700 flex items-center justify-center min-h-80">
      <img id="product-image" src="" alt="" class="w-full h-full object-cover max-h-96" onerror="this.style.display='none';document.getElementById('product-img-fallback').style.display='flex';" />
      <div id="product-img-fallback" class="hidden w-full h-80 items-center justify-center text-slate-600">
        <i data-lucide="package" class="w-24 h-24"></i>
      </div>
    </div>

    <!-- Info -->
    <div class="flex flex-col">
      <div class="flex items-center gap-2 mb-2">
        <span id="product-category" class="text-xs font-semibold px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/30"></span>
      </div>
      <h1 id="product-name" class="text-3xl font-extrabold text-slate-100 tracking-tight mb-2"></h1>
      <div class="flex items-center gap-3 mb-4">
        <span id="product-stock" class="flex items-center gap-1.5 text-sm"></span>
      </div>
      <div id="product-price" class="text-4xl font-extrabold text-amber-400 mb-6"></div>
      <p id="product-description" class="text-slate-400 leading-relaxed mb-8 text-sm"></p>

      <!-- Qty selector -->
      <div class="flex items-center gap-4 mb-4">
        <label class="text-sm text-slate-400 font-medium">Quantity</label>
        <div class="flex items-center border border-slate-600 rounded-sm">
          <button id="qty-minus" class="px-3 py-2 text-slate-300 hover:text-amber-400 hover:bg-slate-700 transition-colors">
            <i data-lucide="minus" class="w-4 h-4"></i>
          </button>
          <input id="qty-input" type="number" value="1" min="1" class="w-14 text-center bg-transparent text-slate-100 text-sm py-2 focus:outline-none border-x border-slate-600" />
          <button id="qty-plus" class="px-3 py-2 text-slate-300 hover:text-amber-400 hover:bg-slate-700 transition-colors">
            <i data-lucide="plus" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div class="flex gap-3">
        <button id="add-to-cart-btn" class="flex-1 flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3 rounded-sm transition-colors text-sm">
          <i data-lucide="shopping-cart" class="w-4 h-4"></i>
          Add to Cart
        </button>
        <a href="cart.html" class="flex items-center justify-center gap-2 border border-slate-600 hover:border-amber-500/60 text-slate-300 hover:text-amber-400 font-medium py-3 px-4 rounded-sm transition-colors text-sm">
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
          View Cart
        </a>
      </div>

      <!-- Meta -->
      <div class="mt-8 pt-6 border-t border-slate-700 grid grid-cols-2 gap-4 text-sm">
        <div>
          <span class="text-slate-500 text-xs uppercase tracking-wider font-semibold">Product ID</span>
          <div id="product-id" class="text-slate-300 mt-0.5 font-mono"></div>
        </div>
        <div>
          <span class="text-slate-500 text-xs uppercase tracking-wider font-semibold">Stock</span>
          <div id="product-stock-count" class="text-slate-300 mt-0.5"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Error -->
  <div id="product-error" class="hidden text-center py-20">
    <i data-lucide="alert-circle" class="w-12 h-12 text-red-400 mx-auto mb-4"></i>
    <p class="text-slate-300 text-lg font-medium">Product not found</p>
    <a href="index.html#products" class="mt-4 inline-flex items-center gap-2 text-amber-400 hover:text-amber-300 text-sm">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Products
    </a>
  </div>

  <!-- Related Products -->
  <section id="related-section" class="hidden">
    <div class="flex items-center gap-4 mb-6">
      <h2 class="text-xl font-bold text-slate-100">Related Products</h2>
      <div class="flex-1 h-px bg-slate-700"></div>
    </div>
    <div id="related-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
  </section>
</main>

<!-- Footer -->
<footer class="bg-slate-900 border-t border-slate-800 py-8">
  <div class="max-w-7xl mx-auto px-4 text-center text-slate-600 text-sm">
    &copy; <span id="footer-year"></span> KHARAT. All rights reserved.
  </div>
</footer>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="js/utils.js"></script>
<script>
  document.getElementById("footer-year").textContent = new Date().getFullYear();
  initNavbar();

  var productId = null;
  var stockMax = 99;

  // Get id from URL
  var params = new URLSearchParams(window.location.search);
  productId = params.get("id");

  if (!productId) {
    showError();
  } else {
    loadProduct();
  }

  function loadProduct() {
    apiFetch("/api/products/" + productId)
      .then(function(r) {
        if (!r.ok) throw new Error("Not found");
        return r.json();
      })
      .then(function(p) {
        var product = p.product || p;
        renderProduct(product);
        loadRelated(product);
      })
      .catch(function() {
        showError();
      });
  }

  function renderProduct(p) {
    stockMax = p.stock_quantity || 0;
    document.getElementById("product-skeleton").style.display = "none";
    document.getElementById("product-detail").classList.remove("hidden");
    document.getElementById("product-detail").classList.add("grid");

    document.getElementById("breadcrumb-name").textContent = p.name;
    document.getElementById("product-name").textContent = p.name;
    document.getElementById("product-category").textContent = p.category || "General";
    document.getElementById("product-price").textContent = formatCurrency(p.price);
    document.getElementById("product-description").textContent = p.description || "No description available.";
    document.getElementById("product-id").textContent = "#" + p.id;
    document.getElementById("product-stock-count").textContent = stockMax + " units";

    var stockEl = document.getElementById("product-stock");
    if (stockMax > 0) {
      stockEl.innerHTML = '<span class="w-1.5 h-1.5 bg-green-400 rounded-full inline-block"></span><span class="text-green-400">In Stock (' + stockMax + ')</span>';
    } else {
      stockEl.innerHTML = '<span class="w-1.5 h-1.5 bg-red-400 rounded-full inline-block"></span><span class="text-red-400">Out of Stock</span>';
      document.getElementById("add-to-cart-btn").disabled = true;
      document.getElementById("add-to-cart-btn").className = "flex-1 flex items-center justify-center gap-2 bg-slate-700 text-slate-500 font-bold py-3 rounded-sm text-sm cursor-not-allowed";
    }

    var img = document.getElementById("product-image");
    if (p.image_url) {
      img.src = p.image_url;
      img.alt = p.name;
    } else {
      img.style.display = "none";
      document.getElementById("product-img-fallback").style.display = "flex";
    }

    // Qty controls
    document.getElementById("qty-input").max = stockMax;
    document.getElementById("qty-minus").addEventListener("click", function() {
      var v = parseInt(document.getElementById("qty-input").value);
      if (v > 1) document.getElementById("qty-input").value = v - 1;
    });
    document.getElementById("qty-plus").addEventListener("click", function() {
      var v = parseInt(document.getElementById("qty-input").value);
      if (v < stockMax) document.getElementById("qty-input").value = v + 1;
    });

    document.getElementById("add-to-cart-btn").addEventListener("click", function() {
      var qty = parseInt(document.getElementById("qty-input").value) || 1;
      addToCart({
        product_id: p.id,
        name: p.name,
        price: p.price,
        quantity: qty,
        image_url: p.image_url || ""
      });
      showToast(p.name + " added to cart!", "success");
    });

    document.title = p.name + " — KHARAT";
    lucide.createIcons();
  }

  function loadRelated(currentProduct) {
    apiFetch("/api/products")
      .then(function(r){ return r.json(); })
      .then(function(data) {
        var all = Array.isArray(data) ? data : (data.products || []);
        var related = all
          .filter(function(p) { return p.id != currentProduct.id && p.is_active !== false; })
          .sort(function() { return Math.random() - 0.5; })
          .slice(0, 4);
        if (related.length === 0) return;

        document.getElementById("related-section").classList.remove("hidden");
        document.getElementById("related-grid").innerHTML = related.map(function(p) {
          return '<a href="product.html?id=' + p.id + '" class="block bg-slate-800 border border-slate-700 rounded-sm overflow-hidden hover:border-amber-500/40 transition-colors group">' +
            (p.image_url
              ? '<img src="' + p.image_url + '" alt="' + p.name + '" class="w-full h-36 object-cover group-hover:opacity-90 transition-opacity" onerror="this.style.display=\'none\'"/>'
              : '<div class="w-full h-36 bg-slate-700 flex items-center justify-center text-slate-600"><i data-lucide="package" class="w-10 h-10"></i></div>') +
            '<div class="p-3">' +
            '<div class="text-xs text-amber-400/80 font-medium mb-0.5">' + (p.category || "General") + '</div>' +
            '<div class="text-sm font-semibold text-slate-200 leading-tight group-hover:text-amber-400 transition-colors">' + p.name + '</div>' +
            '<div class="text-amber-400 font-bold text-sm mt-1">' + formatCurrency(p.price) + '</div>' +
            '</div></a>';
        }).join("");
        lucide.createIcons();
      })
      .catch(function(){});
  }

  function showError() {
    document.getElementById("product-skeleton").style.display = "none";
    document.getElementById("product-error").classList.remove("hidden");
    lucide.createIcons();
  }

  lucide.createIcons();
</script>
</body>
</html>
