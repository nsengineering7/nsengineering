<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — NS Engineers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
      <a href="index.html" class="flex items-center space-x-3 text-amber-700 font-bold text-2xl">
        <div class="bg-amber-600 text-white p-2 rounded-lg font-black text-lg">
          <i class="fa-solid fa-gears"></i>
        </div>
        <span class="text-slate-900">NS ENGINEERS</span>
      </a>
      <a href="index.html" class="text-sm text-slate-600 hover:text-amber-700 font-medium">
        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Store
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-1 w-full">
    <h1 class="text-3xl font-extrabold text-slate-900 mb-8">Your Shopping Cart</h1>

    <div id="cart-container" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Cart Items List -->
      <div class="lg:col-span-2 space-y-4" id="cart-items-list">
        <!-- Injected via JS -->
      </div>

      <!-- Order Summary Card -->
      <div class="lg:col-span-1">
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm sticky top-24 space-y-4">
          <h2 class="text-lg font-bold text-slate-900 pb-3 border-b border-slate-100">Order Summary</h2>
          <div class="space-y-3 text-sm text-slate-600 mb-4">
            <div class="flex justify-between">
              <span>Subtotal</span>
              <span id="subtotal-amount" class="font-bold text-slate-900">PKR 0</span>
            </div>
            <div class="flex justify-between">
              <span>Shipping</span>
              <span class="text-amber-700 font-medium">Calculated at Checkout</span>
            </div>
            <div class="border-t border-slate-100 pt-3 flex justify-between text-base font-black text-amber-700">
              <span>Total</span>
              <span id="total-amount">PKR 0</span>
            </div>
          </div>
          <a href="checkout.html" id="checkout-btn" class="block w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-lg text-center transition shadow">
            Proceed to Checkout
          </a>
          <a href="https://wa.me/923059303974?text=Hello%20Hafiz%20Salman,%20I%20have%20items%20in%20my%20cart%20and%20want%20to%20place%20an%20order." target="_blank" class="block w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg text-center transition shadow">
            <i class="fa-brands fa-whatsapp mr-1.5"></i> Send Order via WhatsApp
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-200 text-center text-sm">
    &copy; 2026 NS Engineers. Lead: Hafiz Salman (+92 305 9303974). All rights reserved.
  </footer>

  <script>
    function loadCart() {
      const cart = JSON.parse(localStorage.getItem('ns_engineers_cart')) || [];
      const listEl = document.getElementById('cart-items-list');
      
      if (cart.length === 0) {
        listEl.innerHTML = `
          <div class="bg-white p-12 rounded-xl text-center border border-slate-200 shadow-sm">
            <i class="fa-solid fa-shopping-cart text-4xl text-slate-300 mb-4"></i>
            <p class="text-slate-500 text-lg mb-4">Your cart is currently empty.</p>
            <a href="index.html" class="inline-block bg-amber-600 text-white font-bold px-6 py-2.5 rounded-lg text-sm shadow">Start Shopping</a>
          </div>
        `;
        document.getElementById('subtotal-amount').textContent = 'PKR 0';
        document.getElementById('total-amount').textContent = 'PKR 0';
        document.getElementById('checkout-btn').style.pointerEvents = 'none';
        document.getElementById('checkout-btn').style.opacity = '0.5';
        return;
      }

      let subtotal = 0;
      listEl.innerHTML = cart.map((item, index) => {
        subtotal += item.price * item.quantity;
        return `
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between gap-4">
            <img src="${item.image}" alt="${item.name}" class="w-20 h-20 object-cover rounded-lg bg-slate-100 border border-slate-200">
            <div class="flex-1">
              <h3 class="font-bold text-slate-900 text-base">${item.name}</h3>
              <p class="text-amber-700 text-sm font-semibold">PKR ${item.price.toLocaleString()}</p>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="updateQty(${index}, -1)" class="bg-slate-100 hover:bg-slate-200 w-8 h-8 rounded text-slate-700 font-bold flex items-center justify-center border border-slate-300">-</button>
              <span class="w-8 text-center font-bold text-slate-900">${item.quantity}</span>
              <button onclick="updateQty(${index}, 1)" class="bg-slate-100 hover:bg-slate-200 w-8 h-8 rounded text-slate-700 font-bold flex items-center justify-center border border-slate-300">+</button>
            </div>
            <div class="text-right font-bold text-slate-900">
              PKR ${(item.price * item.quantity).toLocaleString()}
            </div>
            <button onclick="removeItem(${index})" class="text-slate-400 hover:text-red-600 p-2">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
      }).join('');

      document.getElementById('subtotal-amount').textContent = 'PKR ' + subtotal.toLocaleString();
      document.getElementById('total-amount').textContent = 'PKR ' + subtotal.toLocaleString();
    }

    function updateQty(index, delta) {
      let cart = JSON.parse(localStorage.getItem('ns_engineers_cart')) || [];
      cart[index].quantity += delta;
      if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
      }
      localStorage.setItem('ns_engineers_cart', JSON.stringify(cart));
      loadCart();
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('ns_engineers_cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('ns_engineers_cart', JSON.stringify(cart));
      loadCart();
    }

    loadCart();
  </script>
</body>
</html>
