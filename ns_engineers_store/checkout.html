<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — NS Engineers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
      <a href="index.html" class="flex items-center space-x-3 text-amber-700 font-bold text-2xl">
        <div class="bg-amber-600 text-white p-2 rounded-lg font-black text-lg">
          <i class="fa-solid fa-gears"></i>
        </div>
        <span class="text-slate-900">NS ENGINEERS</span>
      </a>
      <a href="cart.html" class="text-sm text-slate-600 hover:text-amber-700 font-medium">
        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Cart
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-1 w-full">
    <h1 class="text-3xl font-extrabold text-slate-900 mb-8">Secure Checkout</h1>

    <form onsubmit="handleCheckout(event)" class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm space-y-6">
      <h2 class="text-xl font-bold text-slate-900 border-b border-slate-100 pb-3">Shipping Details</h2>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div>
          <label class="block text-xs uppercase tracking-wider font-semibold text-slate-500 mb-2">Full Name</label>
          <input type="text" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-slate-900 focus:outline-none focus:border-amber-600" placeholder="Ahmed Khan">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider font-semibold text-slate-500 mb-2">Phone Number</label>
          <input type="tel" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-slate-900 focus:outline-none focus:border-amber-600" placeholder="+92 300 1234567">
        </div>
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wider font-semibold text-slate-500 mb-2">Delivery Address</label>
        <textarea required rows="3" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-slate-900 focus:outline-none focus:border-amber-600" placeholder="Street address, Workshop or Industrial Area, Lahore"></textarea>
      </div>

      <div class="p-4 bg-slate-50 rounded-lg border border-slate-200 text-sm text-slate-700 flex items-center justify-between">
        <span>Payment Method: <strong>Cash on Delivery (COD)</strong></span>
        <span class="text-amber-700 font-medium"><i class="fa-solid fa-truck-fast mr-1"></i> Fast Shipping</span>
      </div>

      <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-lg transition text-base shadow-md">
        Place Order Now
      </button>
    </form>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-200 text-center text-sm">
    &copy; 2026 NS Engineers. Lead: Hafiz Salman. All rights reserved.
  </footer>

  <script>
    function handleCheckout(e) {
      e.preventDefault();
      alert('Order placed successfully! Thank you for shopping with NS Engineers. We will contact you at +92 305 9303974.');
      localStorage.removeItem('ns_engineers_cart');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
